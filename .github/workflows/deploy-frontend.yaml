name: Deploy frontend to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicit approval to deploy existing Pages project: DEPLOY_EXISTING_PAGES"
        required: true
        type: string

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_EXISTING_PAGES'
    runs-on: ubuntu-latest
    environment: cloudflare-deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy .svelte-kit/cloudflare --project-name dal-frontend --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
