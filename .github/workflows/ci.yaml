name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      candidate_refs:
        description: 'Optional exact six-repository SHA JSON for the complete ecosystem acceptance'
        type: string
        required: false
        default: ''
      args_repository:
        description: 'Official args repository used by ecosystem acceptance'
        type: string
        required: false
        default: fidan-lang/args

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Test + Lint ────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate issue templates
        run: pwsh ./scripts/validate-issue-templates.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Verify license contracts
        run: python3 scripts/check-license.py

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check local-only E2E endpoint safety
        working-directory: frontend
        run: npm run e2e:safety

      - name: Check production cryptography dependency graph
        run: python3 scripts/test-dependency-security.py

      - name: Check public-download edge policy
        run: python3 scripts/test-edge-protection.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Package Markdown security regression
        working-directory: frontend
        run: npm run check:markdown

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run check

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Run non-server workspace tests
        run: cargo test --workspace --all-targets --locked --exclude dal-server

      - name: Run dal-server integration stack
        run: bash ./scripts/test.sh --with-cognito

      - name: Report safe failing Rust test names
        if: failure()
        run: |
          node --test scripts/summarize-test-failure.test.mjs
          node scripts/summarize-test-failure.mjs

  workflow-security:
    name: Workflow input and immutable dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout audited workflow checks (requires coordinated upstream push)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: fidan-lang/fidan-actions
          ref: f02424b12857f728098a2ec42760ad8c4304aa7d
          path: .ci-actions
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - run: python .ci-actions/scripts/test-workflows.py
      - run: python .ci-actions/scripts/check-workflows.py . .ci-actions
      - run: python scripts/test-candidate-inputs.py
      - run: python scripts/test-private-ghcr.py

  # CI already exists on main, so this manual entry point works before merging
  # the new reusable workflow. No default-branch write or deployment is needed.
  ecosystem-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_refs != ''
    uses: ./.github/workflows/ecosystem-acceptance.yaml
    with:
      candidate_refs: ${{ inputs.candidate_refs }}
      args_repository: ${{ inputs.args_repository }}
