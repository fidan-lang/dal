name: Prepare or publish GHCR images (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish only after separate owner approval
      confirmation:
        type: string
        description: Enter PUBLISH_APPROVED_GHCR to permit external image writes
permissions:
  contents: read
concurrency:
  group: ghcr-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: ${{ !inputs.publish || (github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_APPROVED_GHCR') }}
    runs-on: ubuntu-latest
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3, verified official tag
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/fidan-lang/dal-${{ matrix.target }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=dal-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=dal-${{ matrix.target }}
