name: Prepare or publish GHCR images (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish only after separate owner approval
      confirmation:
        type: string
        description: Enter PUBLISH_APPROVED_GHCR to permit external image writes
permissions:
  contents: read
concurrency:
  group: ghcr-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: ${{ !inputs.publish || (github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_APPROVED_GHCR') }}
    runs-on: ubuntu-latest
    environment: ghcr-release
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_ARCHIVE: target/dal-${{ matrix.target }}.oci.tar
      RUNTIME_RECEIPT: target/runtime-equivalence.json
      IMAGE_TARGET: ${{ matrix.target }}
      IMAGE_LOCAL: dal-release:${{ matrix.target }}
      IMAGE_TAG: ghcr.io/fidan-lang/dal/${{ matrix.target }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        target: [server, worker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate protected runtime acceptance before building
        env:
          GHCR_RUNTIME_ACCEPTANCE: ${{ secrets.GHCR_RUNTIME_ACCEPTANCE }}
        run: python3 scripts/check-release-image.py --validate-acceptance
      - name: Confirm PRIVATE packages and release safeguards before registry login
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PRIVATE_ACCESS_REVIEW: ${{ vars.GHCR_PRIVATE_ACCESS_REVIEW }}
        run: python3 scripts/check-private-ghcr.py --receipt target/private-ghcr-before.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUBLISH_USER }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Install OCI copy tooling
        run: |
          mkdir -p target
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - id: image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          # Enable another architecture only after its actual image acceptance passes.
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ env.IMAGE_ARCHIVE }},compression=gzip
          tags: ghcr.io/fidan-lang/dal/${{ matrix.target }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Do not auto-link private packages to the public source repository.
          labels: org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          # Public-repository Actions caches are readable by fork PRs.
          # Keep private image layers inside the ephemeral builder.
      - name: Verify release runtime before any registry push
        env:
          GHCR_RUNTIME_ACCEPTANCE: ${{ secrets.GHCR_RUNTIME_ACCEPTANCE }}
        run: |
          skopeo --override-os linux --override-arch amd64 copy --quiet "oci-archive:$IMAGE_ARCHIVE" "docker-daemon:$IMAGE_LOCAL"
          python3 scripts/check-release-image.py --target "$IMAGE_TARGET" --image "$IMAGE_LOCAL" --archive "$IMAGE_ARCHIVE" --receipt "$RUNTIME_RECEIPT"
      - name: Publish only the verified OCI archive with all attestations
        if: inputs.publish
        run: |
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNTIME_RECEIPT"])); print(r["archive_sha256"] + "  " + os.environ["IMAGE_ARCHIVE"])' | sha256sum --check
          skopeo copy --all --preserve-digests --quiet --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "oci-archive:$IMAGE_ARCHIVE" "docker://$IMAGE_TAG"
      - name: Verify actual published visibility and immutable digest
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PRIVATE_ACCESS_REVIEW: ${{ vars.GHCR_PRIVATE_ACCESS_REVIEW }}
          IMAGE_TARGET: ${{ matrix.target }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/check-private-ghcr.py --target "$IMAGE_TARGET" --digest "$IMAGE_DIGEST" --receipt target/private-ghcr-after.json
      - name: Authenticate dedicated read-only deployment principal
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PULL_USER }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
      - name: Verify authorized immutable pull
        if: inputs.publish
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker pull --platform linux/amd64 "ghcr.io/fidan-lang/dal/$IMAGE_TARGET@$IMAGE_DIGEST"
      - name: Preserve visibility and rollback identity receipts
        if: always() && inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-ghcr-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/private-ghcr-*.json
          if-no-files-found: error
      - name: Remove private build files
        if: always()
        run: rm -f -- "$RUNTIME_RECEIPT" "$IMAGE_ARCHIVE"
